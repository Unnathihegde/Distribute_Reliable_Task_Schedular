global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'api'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['api:8080']

  - job_name: 'scheduler'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['scheduler:8081']

  - job_name: 'worker'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['worker:8082']
