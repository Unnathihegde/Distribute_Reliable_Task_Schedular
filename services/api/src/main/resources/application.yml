# =============================================================================
# API Service Configuration
# =============================================================================

server:
  port: 8080

spring:
  application:
    name: scheduler-api

  # --- PostgreSQL (source of truth) ---
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskscheduler}
    username: ${DB_USER:scheduler}
    password: ${DB_PASSWORD:scheduler_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000   # 20s

  # --- JPA / Hibernate ---
  jpa:
    hibernate:
      ddl-auto: validate    # Flyway manages the schema; Hibernate only validates
    show-sql: false
    open-in-view: false      # Disable OSIV — we control transactions explicitly
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # --- Redis (rate limiting & caching) ---
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # --- Flyway ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

# --- Security & Rate Limiting ---
scheduler:
  security:
    api-key: ${API_KEY}
    rate-limit:
      permits-per-minute: ${RATE_LIMIT_PERMITS:100}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true    # Enables /actuator/health/liveness and /readiness
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://jaeger:4318/v1/traces}
