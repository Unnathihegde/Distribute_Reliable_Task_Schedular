# =============================================================================
# Test profile — used by both @WebMvcTest and @SpringBootTest + Testcontainers
# =============================================================================

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskscheduler}?options=-c%20timezone=UTC
    username: ${DB_USER:scheduler}
    password: ${DB_PASSWORD:scheduler_password}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # --- Redis (rate limiting & caching) ---
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# --- Security & Rate Limiting (Test Profile) ---
scheduler:
  security:
    api-key: test-api-key
    rate-limit-per-minute: 100

logging:
  level:
    com.scheduler: DEBUG
    org.springframework.web: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"
  prometheus:
    metrics:
      export:
        enabled: true
