# =============================================================================
# Test configuration for integration tests using Testcontainers.
#
# NOTE: The actual datasource URL/credentials are overridden programmatically
# via @DynamicPropertySource in TaskApiIntegrationTest, so the values here
# are fallback placeholders only. Flyway runs against the Testcontainers instance.
# =============================================================================

spring:
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway manages schema — Hibernate only validates
    show-sql: false               # Set to true if debugging SQL in test output
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

logging:
  level:
    com.scheduler: DEBUG          # Verbose logging for test diagnostics
    org.flywaydb: INFO
    org.testcontainers: INFO
