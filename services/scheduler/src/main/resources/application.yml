# =============================================================================
# Scheduler Service Configuration
# =============================================================================

server:
  port: 8081

spring:
  application:
    name: scheduler-service

  # --- PostgreSQL (source of truth) ---
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskscheduler}?options=-c%20timezone=UTC
    username: ${DB_USER:scheduler}
    password: ${DB_PASSWORD:scheduler_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000

  # --- JPA / Hibernate ---
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # --- Flyway ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # --- RabbitMQ ---
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:scheduler}
    password: ${RABBITMQ_PASSWORD:scheduler_password}

# --- Scheduler Config ---
scheduler:
  poll-interval: 5000
  batch-size: 50
  retry-sweep-interval: 10000
  lease-recovery-interval: 30000
  stale-queued-interval: 60000
  stale-queued-threshold-minutes: 5

# --- Actuator ---

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://jaeger:4318/v1/traces}
