# =============================================================================
# Worker Service Configuration
# =============================================================================

server:
  port: 8082

spring:
  application:
    name: scheduler-worker

  # --- PostgreSQL (source of truth) ---
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskscheduler}
    username: ${DB_USER:scheduler}
    password: ${DB_PASSWORD:scheduler_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000

  # --- JPA / Hibernate ---
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # --- Flyway ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # --- RabbitMQ ---
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:scheduler}
    password: ${RABBITMQ_PASSWORD:scheduler_password}
    listener:
      simple:
        prefetch: 5          # Max unacknowledged messages per consumer
        acknowledge-mode: manual

# --- Actuator ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
